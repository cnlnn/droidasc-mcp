name: CI

on:
  push:
    paths-ignore:
      - .github/workflows/standard-install.yml
      - scripts/verify_standard_install.py
  pull_request:
    paths-ignore:
      - .github/workflows/standard-install.yml
      - scripts/verify_standard_install.py

permissions:
  contents: read

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: uv run python scripts/setup_rust.py
      - uses: actions/upload-artifact@v4
        with:
          name: rust-asc-${{ matrix.os }}
          path: |
            artifacts/rust_ASC/target/release/rust_ASC
            artifacts/rust_ASC/target/release/rust_ASC.exe
          if-no-files-found: error

  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "12266719"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"
          cache-provider: basic
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: gradle --no-daemon -p tests/fixtures/android :app:assembleDebug :complex:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: signing-tool
          path: ${{ env.ANDROID_HOME }}/build-tools/35.0.0/lib/apksigner.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: acceptance-apk
          path: tests/fixtures/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: complex-fixture
          path: |
            tests/fixtures/android/complex/build/outputs/apk/release/complex-release-unsigned.apk
            tests/fixtures/android/complex/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

  test:
    needs: [fixture, rust]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: acceptance-apk
          path: artifacts/fixture apk
      - uses: actions/download-artifact@v4
        with:
          name: complex-fixture
          path: artifacts/complex
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra dev
      - run: uv run python -c "import droidasc_mcp._dexscan"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: uv run python scripts/setup_jadx.py
      - run: uv run python scripts/setup_dexlib.py
      - uses: actions/download-artifact@v4
        with:
          name: rust-asc-${{ matrix.os }}
          path: artifacts/rust-bin
      - run: uv run python scripts/setup_rust.py --existing artifacts/rust-bin
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python scripts/compile_output_schemas.py --check
      - run: uv run python scripts/compile_input_schemas.py --check
      - run: uv run pytest --cov --cov-report=term-missing --junitxml=test-results.xml
        env:
          ASC_TEST_APK: ${{ github.workspace }}/artifacts/fixture apk/app-debug.apk
          ASC_TEST_EXPECT_FIXTURE: "1"
          ASC_TEST_COMPLEX_APK: ${{ github.workspace }}/artifacts/complex/apk/release/complex-release-unsigned.apk
          ASC_TEST_COMPLEX_MAPPING: ${{ github.workspace }}/artifacts/complex/mapping/release/mapping.txt
      - uses: actions/download-artifact@v4
        with:
          name: signing-tool
          path: artifacts/signing-tool
      - run: >-
          uv run python scripts/verify_signing.py "artifacts/fixture apk/app-debug.apk"
          --apksigner-jar artifacts/signing-tool/apksigner.jar --java java
          --output signing-results.json
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            test-results.xml
            signing-results.json

  package:
    name: package (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra dev
      - run: uv build
      - if: runner.os == 'Linux'
        run: uv run --with auditwheel auditwheel repair dist/*.whl --wheel-dir repaired
      - if: runner.os == 'Linux'
        run: uv run python -c "from pathlib import Path; import shutil; [p.unlink() for p in Path('dist').glob('*.whl')]; [shutil.move(str(p), 'dist') for p in Path('repaired').glob('*.whl')]"
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*
          if-no-files-found: error

  distribution:
    name: distribution (${{ matrix.os }}, ${{ matrix.python-version }})
    needs: [fixture, package, rust]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - python-version: "3.10"
            wheel-python: "3.10"
          - python-version: "3.11"
            wheel-python: "3.11"
          - python-version: "3.12"
            wheel-python: "3.11"
          - python-version: "3.13"
            wheel-python: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions-${{ matrix.os }}-py${{ matrix.wheel-python }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions-ubuntu-latest-py3.11
          path: canonical-dist
      - name: Use the exact canonical release sdist on every platform and Python
        run: python -c "from pathlib import Path; import shutil; import hashlib; p, = Path('canonical-dist').glob('*.tar.gz'); shutil.copyfile(p, Path('dist') / p.name); print('Canonical sdist SHA256', hashlib.sha256(p.read_bytes()).hexdigest())"
      - uses: actions/download-artifact@v4
        with:
          name: acceptance-apk
          path: artifacts/fixture apk
      - uses: actions/download-artifact@v4
        with:
          name: complex-fixture
          path: artifacts/complex
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra dev
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: uv run python scripts/setup_jadx.py
      - run: uv run python scripts/setup_dexlib.py
      - uses: actions/download-artifact@v4
        with:
          name: rust-asc-${{ matrix.os }}
          path: artifacts/rust-bin
      - run: uv run python scripts/setup_rust.py --existing artifacts/rust-bin
      - run: >-
          uv run python scripts/verify_dist.py dist/*.tar.gz dist/*.whl
          --fixture-apk "artifacts/fixture apk/app-debug.apk"
          --complex-apk artifacts/complex/apk/release/complex-release-unsigned.apk
          --complex-mapping artifacts/complex/mapping/release/mapping.txt
        shell: bash

  stability:
    needs: fixture
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: acceptance-apk
          path: artifacts/fixture apk
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra dev
      - run: >-
          uv run python scripts/stability_check.py
          "artifacts/fixture apk/app-debug.apk"
          --duration 20 --workers 2 --max-host-rss-growth-mib 128
        shell: bash
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: uv run python scripts/setup_jadx.py
      - run: uv run python scripts/setup_dexlib.py
      - run: uv run python -m zipfile -e "artifacts/fixture apk/app-debug.apk" artifacts/stability-dex
      - run: >-
          uv run python scripts/stability_dex.py
          artifacts/stability-dex/classes.dex artifacts/stability-dex/classes2.dex
          --method-descriptor "Lorg/example/droidascfixture/MethodCases;->choose(I)Ljava/lang/String;"
          --field-descriptor "Lorg/example/droidascfixture/Probe;->visits:I"
        shell: bash
