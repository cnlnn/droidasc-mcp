[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "droidasc-mcp"
version = "0.2.4"
description = "A safe, structured MCP server for the Droid ASC Android decompiler"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "cnlnn" },
]
keywords = ["android", "apk", "decompiler", "mcp", "reverse-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
]
dependencies = [
    "axml>=0.0.2,<0.1",
    "cryptography>=43,<51",
    "droidasc>=0.1.2.post3,<0.2",
    "lxml>=5,<7",
    "mcp>=2.2,<3",
    "psutil>=7,<8",
    "pydantic>=2,<3",
    "typing-extensions>=4.12,<5",
    "pywin32==312; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6",
    "ruff>=0.12",
]

[project.scripts]
droidasc-mcp = "droidasc_mcp.server:main"

[project.urls]
Homepage = "https://github.com/cnlnn/droidasc-mcp"
Issues = "https://github.com/cnlnn/droidasc-mcp/issues"
Source = "https://github.com/cnlnn/droidasc-mcp"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
droidasc_mcp = ["*.java", "*.c", "output_schemas.json", "input_schemas.json"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["droidasc_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
